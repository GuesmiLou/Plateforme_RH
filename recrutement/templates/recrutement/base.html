<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App RH{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'liste_offres' %}">
                <i class="bi bi-briefcase-fill text-primary me-2"></i>RH Platform
            </a>
            <div class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <span class="nav-link disabled text-light me-3">
                        <i class="bi bi-building me-1"></i>{{ user.nom_entreprise|default:user.username }}
                    </span>

                    {% if user.is_staff or user.is_superuser %}
                        <a class="btn btn-outline-light btn-sm me-2" href="/admin/">
                            <i class="bi bi-speedometer2 me-1"></i>Administration
                        </a>
                    {% endif %}

                    <a class="btn btn-danger btn-sm" href="{% url 'deconnexion' %}">
                        <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                    </a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="{% url 'connexion' %}">Connexion</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
