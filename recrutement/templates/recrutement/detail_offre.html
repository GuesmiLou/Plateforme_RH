<h1>{{ offre.titre }}</h1>
<p>{{ offre.description }}</p>
<p>Lieu : {{ offre.lieu }}</p>
<p>Statut : {{ offre.statut_offre }}</p>
<p>Du {{ offre.date_debut }} au {{ offre.date_fin }}</p>

<a href="{% url 'modifier_offre' offre.id %}">Modifier</a>
<a href="{% url 'supprimer_offre' offre.id %}">Supprimer</a>
<a href="{% url 'liste_offres' %}">Retour à la liste</a>
<a href="{% url 'liste_candidatures' offre.id %}">Voir les candidatures</a>
