{% extends "recrutement/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle-fill display-3"></i>
                </div>
                <h4 class="fw-bold text-dark mb-2">Supprimer l'offre ?</h4>
                <p class="text-muted mb-4">
                    Êtes-vous sûr de vouloir supprimer définitivement l'offre 
                    <strong>"{{ offre.titre }}"</strong> ? Cette action est irréversible.
                </p>
                <form method="post" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <a href="{% url 'detail_offre' offre.id %}" class="btn btn-light border px-4">Annuler</a>
                    <button type="submit" class="btn btn-danger px-4">Confirmer la suppression</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
