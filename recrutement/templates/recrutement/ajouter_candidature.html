{% extends "recrutement/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="fw-bold mb-0 text-dark">Ajouter un candidat</h4>
                <p class="text-muted small mb-0">Poste : {{ offre.titre }}</p>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'liste_candidatures' offre.id %}" class="btn btn-light border">Annuler</a>
                        <button type="submit" class="btn btn-primary">Enregistrer le candidat</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
