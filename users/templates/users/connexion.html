{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - RH Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <a href="{% url 'accueil' %}" class="text-decoration-none text-dark">
                        <i class="bi bi-briefcase-fill text-primary display-5 d-block mb-2"></i>
                        <h3 class="fw-bold mb-0">RH Platform</h3>
                    </a>
                    <p class="text-muted small mt-1">Espace Recruteur & Administration</p>
                </div>

                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3 text-center border-bottom-0">
                        <h4 class="fw-bold mb-0 text-dark">Connexion</h4>
                    </div>
                    <div class="card-body p-4 pt-1">
                        <form method="post" novalidate>
                            {% csrf_token %}
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-bold">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Se connecter
                            </button>
                        </form>
                    </div>
                    <div class="card-footer bg-white border-top text-center py-3">
                        <p class="small text-muted mb-0">
                            Pas encore de compte ? 
                            <a href="{% url 'inscription' %}" class="text-primary fw-bold text-decoration-none">Créer un compte entreprise</a>
                        </p>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="{% url 'accueil' %}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Retour à l'accueil
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
